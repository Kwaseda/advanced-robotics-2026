# Lab 2 task 3: two static obstacles. Overlay on mpc.yaml.

/**:
  ros__parameters:
    boundary_x: [-2.0, 2.0]
    boundary_y: [-2.0, 2.0]

    # A slalom: one obstacle above the direct line, one below it further along, so the
    # robot steers twice in opposite directions and both constraints do work. Parallel
    # arrays because ROS 2 parameters have no nested type; index i of the three is one
    # obstacle, and each becomes its own named nl_cons (obs1, obs2).
    #
    # These are not the tutorial's coordinates. The tutorial bounds vx at 0.8 m/s and the
    # Burger does 0.22, so the same 20-step horizon covers 1.6 m there and 0.44 m here,
    # less than one inflated obstacle diameter. With both of its obstacles inflated by the
    # robot's footprint the corridor between them closes from a head-on start and the
    # problem becomes infeasible. Raising the horizon does not fix it; the geometry does.
    obstacle_x: [0.7, 1.3]
    obstacle_y: [0.15, -0.15]
    obstacle_radius: [0.15, 0.15]

    # Suggested goal: (x: 1.8, y: 0.0)
