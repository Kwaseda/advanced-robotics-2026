# Shared MPC parameters for all four tasks. mpc_task<N>.yaml overrides what a task changes.

/**:
  ros__parameters:
    t_step: 0.1          # s, prediction step and control period (worst solve ~45 ms)
    n_horizon: 20        # steps: 2 s, or 0.44 m of travel at 0.22 m/s
    goal_tolerance: 0.05 # m, stop here or the robot creeps on odometry noise

    # The lab allows v < 0.5 and |omega| < 0.8; the Burger itself tops out at 0.22 m/s.
    max_linear_velocity: 0.22
    max_angular_velocity: 0.8
    min_linear_velocity: 0.0   # no reversing

    boundary_x: [-1.0, 1.0]
    boundary_y: [-1.0, 1.0]

    q_position: 1.0      # stage cost on squared position error
    q_terminal: 1.0      # same, on the last predicted step
    r_input: 0.01        # penalty on changes in v and omega, for smooth commands

    obstacle_inflation: 0.105  # m, about the Burger's half-diagonal, since the model is a point
    obstacle_soft: false
    obstacle_penalty: 10000.0
    odom_timeout: 0.5    # s, stop if odometry goes stale
