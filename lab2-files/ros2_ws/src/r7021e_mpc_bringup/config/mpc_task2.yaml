# Task 2: one obstacle. Goal (1.5, 0.0).

/**:
  ros__parameters:
    # Wider box so the box and the obstacle do not squeeze the robot from both sides.
    boundary_x: [-2.0, 2.0]
    boundary_y: [-2.0, 2.0]

    # 8 cm off the straight line: dead on it, left and right cost the same and the robot stalls.
    obstacle_x: [0.75]
    obstacle_y: [0.08]
    obstacle_radius: [0.15]
