# Task 4 reference: 0.8 m circle about the start point, 60 s per lap (0.084 m/s).
# n_horizon and t_step come from the launch file, so they always match the MPC.

/trajectory_node:
  ros__parameters:
    radius: 0.8
    centre_x: 0.0
    centre_y: 0.0
    lap_period: 60.0
    laps: 2
    start_delay: 8.0     # s to drive from the centre onto the circle
    publish_period: 0.05
