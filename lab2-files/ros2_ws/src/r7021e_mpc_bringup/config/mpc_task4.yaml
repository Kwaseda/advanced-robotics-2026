# Task 4: circle of radius 0.8 (circle.yaml) with one obstacle.

/**:
  ros__parameters:
    boundary_x: [-1.5, 1.5]
    boundary_y: [-1.5, 1.5]

    # Just inside the circle at the top: the robot bulges out ~45 mm around it.
    # On or outside the circle the detour is longer than the horizon can see.
    obstacle_x: [0.0]
    obstacle_y: [0.62]
    obstacle_radius: [0.12]

    # Soft here only: the path rides the constraint edge, and with a hard constraint any
    # delay puts the measured pose inside it, which is infeasible forever.
    obstacle_soft: true
    obstacle_penalty: 10000.0
